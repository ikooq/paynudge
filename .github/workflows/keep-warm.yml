# Render's free plan puts the service to sleep after 15 minutes without traffic, and the first
# visit then takes about a minute. Judging runs Dec 1-15, 2026, so this pings the public demo
# every 10 minutes to keep it awake. It only calls /api/status (no AI or PayPal writes).
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live demo
        run: curl -fsS --max-time 120 --retry 2 https://paynudge-sz4i.onrender.com/api/status -o /dev/null
